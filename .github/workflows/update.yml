name: update
on:
  schedule:
    # 毎日 日本時間 6:00 に実行（UTC 21:00 相当）
    - cron: "0 21 * * *"
  workflow_dispatch:        # 手動実行も可能
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read Python version
        id: python
        run: echo "version=$(cat .python-version)" >> $GITHUB_OUTPUT

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ steps.python.outputs.version }}
          cache: "pip"

      - name: Run fetch_doubles
        run: python fetch_doubles.py || exit 1

      - name: Run fetch_singles
        run: python fetch_singles.py || exit 1

      - name: Run fetch_gundam
        run: python fetch_gundam.py || exit 1

      - name: Check for changes
        id: check
        run: git diff --quiet || echo "changes_found=true" >> $GITHUB_OUTPUT

      - name: Configure Git
        if: steps.check.outputs.changes_found == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push
        if: steps.check.outputs.changes_found == 'true'
        run: |
          git add docs/articles.json docs/singles.json docs/gundam.json
          git commit -m "記事リストを更新 $(date +'%Y-%m-%d %H:%M:%S')"
          git push

      - name: Report success
        run: echo "✅ All scripts executed successfully"

