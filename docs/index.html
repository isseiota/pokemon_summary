<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ポケチャン note記事まとめ</title>
<style>
:root{--bg:#f6f8fb;--ink:#17212f;--sub:#5d6b7e;--line:#d9e0ea;--accent:#0b7a75;--card:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#10161f;--ink:#e6ecf4;--sub:#9aa8ba;--line:#26313f;--accent:#4cc9c0;--card:#171f2b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.7 "Hiragino Sans","Noto Sans JP","Yu Gothic",sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 20px 64px}
h1{font-size:1.5rem;line-height:1.4;margin:0 0 4px}
.meta{color:var(--sub);font-size:.875rem;margin:0 0 24px}
input{width:100%;padding:10px 14px;font:inherit;color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:8px}
input:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.tabs{display:flex;gap:8px;margin:0 0 24px;border-bottom:1px solid var(--line);padding-bottom:12px}
.tab-btn{padding:8px 16px;background:none;border:none;cursor:pointer;color:var(--sub);font-weight:600;border-bottom:2px solid transparent;margin:-12px 0 0 0}
.tab-btn.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-btn:hover{color:var(--accent)}
h2{font-size:.9rem;color:var(--sub);font-weight:600;margin:32px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0}
li a{color:var(--ink);text-decoration:none;font-weight:600}
li a:hover{color:var(--accent);text-decoration:underline}
li span{display:block;color:var(--sub);font-size:.85rem}
.empty{color:var(--sub);margin-top:32px}
</style>
</head>
<body>
<main>
  <h1>ポケチャン<br>note記事まとめ</h1>
  <p class="meta" id="meta">読み込み中…</p>
  <div class="tabs">
    <button class="tab-btn active" data-type="doubles">ダブルバトル</button>
    <button class="tab-btn" data-type="singles">シングルバトル</button>
  </div>
  <input id="q" type="search" placeholder="タイトルや著者名で絞り込む" aria-label="記事を絞り込む">
  <div id="list"></div>
</main>
<script>
(async () => {
  const meta = document.getElementById("meta"), list = document.getElementById("list"), q = document.getElementById("q");
  const tabBtns = document.querySelectorAll(".tab-btn");
  let data = {}, currentType = "doubles";

  try {
    const [d, s] = await Promise.all([
      (await fetch(`articles.json?t=${Date.now()}`, {cache: "no-cache"})).json(),
      (await fetch(`singles.json?t=${Date.now()}`, {cache: "no-cache"})).json()
    ]);
    data = {doubles: d, singles: s};
  } catch {
    meta.textContent = "記事リストを読み込めませんでした。時間をおいて再読み込みしてください。";
    return;
  }

  function updateMeta() {
    const current = data[currentType];
    const all = current.articles || [];
    meta.textContent = current.updated
      ? `${all.length}件・最終更新 ${current.updated.replace("T", " ").slice(0, 16)}（毎朝自動更新）`
      : "まだ記事がありません。初回の自動更新をお待ちください。";
  }

  function render() {
    const current = data[currentType];
    const all = current.articles || [];
    const kw = q.value.trim().toLowerCase();
    const hit = all.filter(a => !kw || (a.title + " " + a.author).toLowerCase().includes(kw));
    list.replaceChildren();
    if (!hit.length) { const p = document.createElement("p"); p.className = "empty"; p.textContent = "該当する記事がありません。"; list.append(p); return; }
    let ul, last = "";
    for (const a of hit) {
      if (a.date !== last) {
        last = a.date;
        const h = document.createElement("h2"); h.textContent = a.date; ul = document.createElement("ul"); list.append(h, ul);
      }
      const li = document.createElement("li"), link = document.createElement("a"), by = document.createElement("span");
      link.href = a.link; link.textContent = a.title || a.link; link.target = "_blank"; link.rel = "noopener noreferrer";
      by.textContent = a.author;
      li.append(link, by); ul.append(li);
    }
  }

  tabBtns.forEach(btn => {
    btn.addEventListener("click", () => {
      tabBtns.forEach(b => b.classList.remove("active"));
      btn.classList.add("active");
      currentType = btn.dataset.type;
      q.value = "";
      updateMeta();
      render();
    });
  });

  q.addEventListener("input", render);
  updateMeta();
  render();
})();
</script>
</body>
</html>
